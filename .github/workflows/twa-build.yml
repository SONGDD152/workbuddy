name: Build Android APK (TWA)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/twa-manifest.json'
      - '.github/workflows/twa-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Use runner Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          SDKMANAGER=$(find /usr/local/lib/android/sdk/cmdline-tools -name sdkmanager -type f | head -1)
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          mkdir -p "$HOME/.bubblewrap"
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}' "$JAVA_HOME" "$ANDROID_HOME" > "$HOME/.bubblewrap/config.json"
          echo "sdk ready: $ANDROID_HOME | jdk: $JAVA_HOME"

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Prepare TWA workspace
        env:
          TWA_KEYSTORE_BASE64: ${{ secrets.TWA_KEYSTORE_BASE64 }}
        run: |
          mkdir -p twa-build
          cp android/twa-manifest.json twa-build/twa-manifest.json
          echo "$TWA_KEYSTORE_BASE64" | base64 -d > twa-build/android.keystore
          echo "keystore bytes: $(wc -c < twa-build/android.keystore)"

      - name: Generate Android project from twa-manifest.json
        working-directory: twa-build
        run: bubblewrap update --skipVersionUpgrade

      - name: Build signed APK and AAB
        working-directory: twa-build
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.TWA_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.TWA_KEY_PASSWORD }}
        run: bubblewrap build --skipPwaValidation

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: xiaobaiguanjia-android
          path: |
            twa-build/app-release-signed.apk
            twa-build/app-release-bundle.aab
          if-no-files-found: error
