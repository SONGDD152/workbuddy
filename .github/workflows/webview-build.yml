name: Build Android WebView APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-native/**'
      - '.github/workflows/webview-build.yml'

# 允许用内置 GITHUB_TOKEN 发布 Release（不需要额外的个人令牌）
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          SDK=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV
          SDKMANAGER=$(find "$SDK/cmdline-tools" -name sdkmanager -type f | head -1)
          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --sdk_root="$SDK" "platforms;android-35" "build-tools;35.0.0" > /dev/null 2>&1 || true
          echo "sdk=$SDK"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Decode signing key
        env:
          TWA_KEYSTORE_BASE64: ${{ secrets.TWA_KEYSTORE_BASE64 }}
        run: |
          echo "$TWA_KEYSTORE_BASE64" | base64 -d > android-native/app/android.keystore
          echo "keystore bytes: $(wc -c < android-native/app/android.keystore)"

      - name: Build signed release APK
        working-directory: android-native
        env:
          TWA_KEYSTORE_PATH: android.keystore
          TWA_KEYSTORE_PASSWORD: ${{ secrets.TWA_KEYSTORE_PASSWORD }}
          TWA_KEY_PASSWORD: ${{ secrets.TWA_KEY_PASSWORD }}
          TWA_KEY_ALIAS: ${{ secrets.TWA_KEY_ALIAS }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Verify output
        run: |
          ls -lh android-native/app/build/outputs/apk/release/
          test -f android-native/app/build/outputs/apk/release/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: xiaobaiguanjia-webview-android
          path: android-native/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      # 同时发一份到 Release：公开仓库的 Release 资产可匿名下载，
      # 便于把安装包同步到站点 /downloads/，不必依赖任何个人令牌。
      # 版本号直接读 build.gradle，避免 workflow 和 Gradle 各写一份。
      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(sed -n 's/.*versionName "\(.*\)".*/\1/p' android-native/app/build.gradle | head -1)
          TAG="v${VERSION}"
          ASSET="xiaobaiguanjia-${VERSION}.apk"
          APK="android-native/app/build/outputs/apk/release/app-release.apk"
          cp "$APK" "/tmp/${ASSET}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "更新已有 Release ${TAG}"
          else
            gh release create "$TAG" --title "小白管家 v${VERSION}" \
              --target "$GITHUB_SHA" \
              --notes "小白管家 Android 安装包 v${VERSION}。签名密钥与旧版一致，可直接覆盖安装。"
          fi
          gh release upload "$TAG" "/tmp/${ASSET}#${ASSET}" --clobber
          echo "已发布 https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
