plugins {
    id "com.android.application"
}

android {
    namespace "online.songdd.xbgj"
    compileSdk 35

    defaultConfig {
        // 必须与已发布的 TWA 版一致，否则老用户无法覆盖安装
        applicationId "online.songdd.xbgj"
        minSdk 24
        targetSdk 35
        versionCode 4
        versionName "1.3.0"
    }

    signingConfigs {
        release {
            def keyPath = System.getenv("TWA_KEYSTORE_PATH") ?: "android.keystore"
            storeFile file(keyPath)
            storeType "PKCS12"
            storePassword System.getenv("TWA_KEYSTORE_PASSWORD")
            keyAlias System.getenv("TWA_KEY_ALIAS")
            keyPassword System.getenv("TWA_KEY_PASSWORD")
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
